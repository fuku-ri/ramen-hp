<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow"><title>スタッフ管理｜麺処 朱</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css">
</head>
<body class="admin-body">
  <section class="login-screen" id="loginScreen">
    <form class="login-box" id="loginForm"><div class="brand-mark large">朱</div><p>麺処 朱</p><h1 id="loginTitle">スタッフログイン</h1><label>パスワード<input id="passwordInput" type="password" autocomplete="current-password" minlength="12" required placeholder="12文字以上"></label><button class="button primary full" id="loginButton">管理画面を開く</button><p class="login-hint" id="loginHint">パスワードを入力してください。</p><p class="error" id="loginError"></p><a href="index.html">← お店のページに戻る</a></form>
  </section>
  <div class="admin-app" id="adminApp" hidden>
    <header class="admin-header"><div><span class="brand-mark small">朱</span><b>麺処 朱</b><span>スタッフ管理</span></div><div><a href="index.html" target="_blank">公開ページを見る ↗</a><button id="logoutButton">ログアウト</button></div></header>
    <main class="admin-main">
      <div class="admin-welcome"><div><span class="admin-date" id="adminDate"></span><h1>お店の状況を更新しましょう</h1><p>変更はこの端末の公開ページにすぐ反映されます。</p></div><span class="save-state" id="saveState">✓ 保存済み</span></div>
      <section class="admin-panel occupancy-panel"><div class="panel-title"><span class="step">1</span><div><h2>現在の空き状況</h2><p>公開ページに大きく表示されます</p></div></div><div class="status-buttons"><button data-status="available"><span>○</span><b>空席あり</b><small>すぐにご案内できます</small></button><button data-status="busy"><span>△</span><b>少し待ち</b><small>5〜15分ほど</small></button><button data-status="full"><span>×</span><b>満席です</b><small>お時間をいただきます</small></button><button data-status="closed"><span>—</span><b>営業時間外</b><small>準備中・閉店</small></button></div><div class="status-preview"><span>お客様には</span><strong id="statusPreview">「空席あり」と表示中</strong><small id="statusTime"></small></div></section>
      <section class="admin-panel"><div class="panel-title menu-admin-title"><span class="step">2</span><div><h2>メニューの管理</h2><p>追加・変更・売り切れ設定ができます</p></div><button class="button primary" id="addMenuButton">＋ 新しいメニュー</button></div><div class="admin-menu-list" id="adminMenuList"></div></section>
      <section class="admin-panel"><div class="panel-title"><span class="step">3</span><div><h2>店舗情報</h2><p>公開ページの店名・住所・営業時間を変更します</p></div></div><form id="storeForm" class="store-form"><div class="form-grid"><label>店名<input id="storeName" required></label><label>郵便番号<input id="storePostal"></label></div><label>キャッチコピー<input id="storeTagline"></label><label>お店の紹介<textarea id="storeDescription" rows="3"></textarea></label><div class="form-grid"><label>住所<input id="storeAddress"></label><label>電話番号<input id="storePhone"></label><label>営業時間<input id="storeHours"></label><label>定休日<input id="storeHoliday"></label><label>席数<input id="storeSeats"></label><label>GoogleマップURL<input id="storeMap" type="url"></label></div><div class="dialog-actions"><button class="button dark">店舗情報を保存</button></div></form></section>
    </main>
  </div>

  <dialog id="menuDialog"><form method="dialog" id="menuForm"><div class="dialog-head"><div><small id="dialogLabel">メニューを追加</small><h2 id="dialogTitle">新しいメニュー</h2></div><button value="cancel" class="icon-button" aria-label="閉じる">×</button></div><input type="hidden" id="menuId"><label>料理の写真<div class="photo-upload" id="photoUpload"><img id="photoPreview" alt="写真プレビュー"><div><b>写真を選ぶ</b><small>JPG・PNG（自動で縮小します）</small></div><input id="menuPhoto" type="file" accept="image/*"></div></label><div class="form-grid"><label>メニュー名<input id="menuName" required placeholder="例：特製醤油らぁ麺"></label><label>価格（税込）<div class="price-input"><span>¥</span><input id="menuPrice" required type="number" min="0" step="10" placeholder="1200"></div></label></div><label>説明<textarea id="menuDescription" rows="3" placeholder="味や具材の特徴を入力"></textarea></label><label>カテゴリー<select id="menuCategory"><option value="ramen">らぁ麺</option><option value="side">ご飯・一品</option><option value="drink">お飲み物</option></select></label><div class="dialog-actions"><button value="cancel" class="button secondary">キャンセル</button><button value="default" class="button primary" id="saveMenuButton">この内容で保存</button></div></form></dialog>
  <div class="toast" id="toast">保存しました</div>
  <script src="admin.js"></script>
</body>
</html>
